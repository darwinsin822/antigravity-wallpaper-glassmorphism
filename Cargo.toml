[workspace]
resolver = "2"
members = [
    "crates/agy-glass-core",
    "crates/agy-glass-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["DarwinSin <pinargote1987@gmail.com>", "Kineyo <shebxyd204@gmail.com>"]
license = "MIT"
repository = "https://github.com/darwinsin822/antigravity-wallpaper-glassmorphism"

[workspace.dependencies]
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3"
